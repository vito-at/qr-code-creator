# Запуск на сервере CRM: приложение подключается к сети CRM под именем qr-code-app,
# и Caddy из CRM отдаёт его по домену VERIFY_DOMAIN (см. crm/Caddyfile).
# Сеть CRM обычно называется crm_default; проверить: docker network ls
services:
  app:
    networks:
      default:
      crm:
        aliases: [qr-code-app]

networks:
  crm:
    external: true
    name: ${CRM_NETWORK:-crm_default}
