# Запуск на отдельном сервере со своим Caddy: docker compose --profile https up -d --build
# На сервере CRM этот файл не используется: сайт запускается из crm/docker-compose.yml (см. README).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    volumes:
      - data:/data            # база и загруженные файлы — не теряются при обновлении

  # свой HTTPS-прокси — только для отдельного сервера (порты 80/443 должны быть свободны)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
